<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laboratório 1 — Verificador de idade</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <span class="tag">CEUB · JavaScript · Aula 2</span>
    <h1>Verificador de idade</h1>
    <p class="desc">Informe uma idade inteira entre 0 e 120 anos.</p>
    <label for="idade">Idade</label>
    <input id="idade" type="number" min="0" max="120" step="1" placeholder="Ex.: 17">
    <button id="verificar" type="button">Verificar</button>
    <p id="resultado" role="status" aria-live="polite">O resultado aparecerá aqui.</p>
    <p class="small">Inclui desafio extra: quantos anos faltam para os 18.</p>
  </main>
</body>
</html>
